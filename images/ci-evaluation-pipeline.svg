<svg viewBox="0 0 1760 330" width="1760" height="330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc">
<title id="ttl">Continuous integration pipeline</title>
<desc id="desc">On each pull request the action rebuilds the index, diffs against the base branch, classifies and scores the changed documentation files, posts a sticky comment, and fails the check when a doc scores below the configured threshold.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="#5c5c5c"/></marker></defs>
<style>
.t{font:500 15px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#1a1a1a}
.s{font:13px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#5c5c5c}
.chip{font:600 12px ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#fff;letter-spacing:.03em}
.ln{stroke:#5c5c5c;stroke-width:1.6;fill:none;marker-end:url(#arw)}
</style>
<rect width="1760" height="330" fill="#ffffff"/>
<rect x="28" y="56" width="1704" height="234" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="42" y="43" width="428" height="26" rx="5" fill="#1a1a1a"/>
<text x="48" y="60" class="chip">CONTINUOUS INTEGRATION PIPELINE (GitHub Action)</text>
<rect x="64" y="112" width="210" height="112" rx="9" fill="#ece6fa" stroke="#6b4fc9" stroke-width="1.8"/>
<text x="169" y="164" class="t" text-anchor="middle">Pull request</text>
<text x="169" y="182" class="s" text-anchor="middle">opened or updated</text>
<path class="ln" d="M280 168 H318"/>
<rect x="322" y="112" width="210" height="112" rx="9" fill="#ece6fa" stroke="#6b4fc9" stroke-width="1.8"/>
<text x="427" y="154" class="t" text-anchor="middle">Action checks out</text>
<text x="427" y="173" class="s" text-anchor="middle">the branch and</text>
<text x="427" y="192" class="s" text-anchor="middle">rebuilds the index</text>
<path class="ln" d="M538 168 H576"/>
<rect x="580" y="112" width="210" height="112" rx="9" fill="#ece6fa" stroke="#6b4fc9" stroke-width="1.8"/>
<text x="685" y="154" class="t" text-anchor="middle">Diff against the</text>
<text x="685" y="173" class="s" text-anchor="middle">base branch for</text>
<text x="685" y="192" class="s" text-anchor="middle">changed docs</text>
<path class="ln" d="M796 168 H834"/>
<rect x="838" y="112" width="210" height="112" rx="9" fill="#ece6fa" stroke="#6b4fc9" stroke-width="1.8"/>
<text x="943" y="154" class="t" text-anchor="middle">classify_documents()</text>
<text x="943" y="173" class="s" text-anchor="middle">then score each</text>
<text x="943" y="192" class="s" text-anchor="middle">changed file</text>
<path class="ln" d="M1054 168 H1092"/>
<rect x="1096" y="112" width="210" height="112" rx="9" fill="#ece6fa" stroke="#6b4fc9" stroke-width="1.8"/>
<text x="1201" y="164" class="t" text-anchor="middle">Sticky PR comment</text>
<text x="1201" y="182" class="s" text-anchor="middle">from ci_report.md</text>
<path class="ln" d="M1312 168 H1350"/>
<rect x="1354" y="112" width="226" height="112" rx="9" fill="#ece6fa" stroke="#6b4fc9" stroke-width="1.8"/>
<text x="1467" y="154" class="t" text-anchor="middle">Check passes</text>
<text x="1467" y="173" class="s" text-anchor="middle">or fails on</text>
<text x="1467" y="192" class="s" text-anchor="middle">DOC_QUALITY_THRESHOLD</text>
</svg>
