<text x="882" y="387" class="s" text-anchor="middle">from knowledge_base</text>
<text x="882" y="406" class="s" text-anchor="middle">+ guaranteed docType</text>
<path class="ln" d="M986 382 H1020"/>
<rect x="1024" y="330" width="196" height="104" rx="9" fill="#fbe4f3" stroke="#c9539f" stroke-width="1.8"/>
<text x="1122" y="368" class="t" text-anchor="middle">Anthropic API call</text>
<text x="1122" y="387" class="s" text-anchor="middle">(prompt + retrieved</text>
<text x="1122" y="406" class="s" text-anchor="middle">guidelines)</text>
<path class="ln" d="M1226 382 H1260"/>
<rect x="1264" y="330" width="196" height="104" rx="9" fill="#fbe4f3" stroke="#c9539f" stroke-width="1.8"/>
<text x="1362" y="368" class="t" text-anchor="middle">Model evaluates</text>
<text x="1362" y="387" class="s" text-anchor="middle">against 5 criteria</text>
<text x="1362" y="406" class="s" text-anchor="middle">(1–5 scale)</text>
<path class="ln" d="M1466 382 H1500"/>
<rect x="1504" y="330" width="196" height="104" rx="9" fill="#fbe4f3" stroke="#c9539f" stroke-width="1.8"/>
<text x="1602" y="368" class="t" text-anchor="middle">submit_evaluation</text>
<text x="1602" y="387" class="s" text-anchor="middle">tool call returns</text>
<text x="1602" y="406" class="s" text-anchor="middle">a parsed object</text>
<path class="ln" d="M1706 382 H1740"/>
<rect x="1744" y="330" width="196" height="104" rx="9" fill="#fbe4f3" stroke="#c9539f" stroke-width="1.8"/>
<text x="1842" y="378" class="t" text-anchor="middle">Results printed</text>
<text x="1842" y="396" class="s" text-anchor="middle">to terminal</text>
